services:
  postgres:
    image: postgres:16
    container_name: airflow-postgres-chicago-crime
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: airflow-init-chicago-crime
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
    entrypoint: /bin/bash
    command: >
      -c "
      echo 'Waiting for PostgreSQL...' &&
      sleep 10 &&
      airflow db migrate &&
      airflow users create --username airflow --firstname admin --lastname admin --role Admin --email admin@gmail.com --password airflow &&
      echo '✅ Airflow DB initialized successfully.'"

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: airflow-webserver-chicago-crime
    restart: always
    depends_on:
      - airflow-init
      - airflow-scheduler
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/data
      - ./app:/opt/spark-app
    ports:
      - "8088:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: airflow-scheduler-chicago-crime
    restart: always
    depends_on:
      - airflow-init
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./data:/opt/data
      - ./app:/opt/spark-app
    command: scheduler

  spark-master:
    image: apache/spark:3.5.1
    environment:
      SPARK_DRIVER_MEMORY: 4g
    container_name: spark-master-chicago-crime
    hostname: spark-master-chicago-crime
    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      python3 /opt/spark-app/spark_api.py
      "
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master port
      - "8000:8000"
    volumes:
      - ./app:/opt/spark-app
      - ./data:/opt/data

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1-chicago-crime
    hostname: spark-worker-1-chicago-crime
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master-chicago-crime:7077 --cores 2 --memory 4g &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out"
    ports:
      - "8081:8081"
      - "4040:4040"
    depends_on:
      - spark-master
    volumes:
      - ./app:/opt/spark-app
      - ./data:/opt/data

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2-chicago-crime
    hostname: spark-worker-2-chicago-crime
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master-chicago-crime:7077 --cores 2 --memory 4g &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker*.out"
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    volumes:
      - ./app:/opt/spark-app
      - ./data:/opt/data

volumes:
  postgres_data: